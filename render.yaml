services:
  # Backend API
  - type: web
    name: bici-reorder-point-dashboard-b
    runtime: docker
    rootDir: backend
    plan: free # Ensure it stays on free tier if needed
    envVars:
      # Cap glibc malloc arenas so freed pandas/pyarrow buffers are returned to
      # the OS instead of fragmenting across per-thread arenas. Cheap insurance
      # against RSS creep on the 512MB instance, independent of the query fixes.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Shared secret required on every API request (injected by the frontend proxy).
      # Set the value in the Render dashboard; must match the frontend's copy.
      - key: BACKEND_SHARED_SECRET
        sync: false
      # HLC (Cycles Lambert) shipment tracking on the PO tracker. Off unless
      # HLC_ENABLED is set; the API key goes in the dashboard, never in git.
      - key: HLC_ENABLED
        value: "false"
      - key: HLC_API_KEY
        sync: false
      # Canada runs the v3.0 "legacy" API — the v4.x endpoints 404 here.
      - key: HLC_BASE_URL
        value: https://api.hlc.bike/ca/v3.0

  # Frontend Dashboard
  - type: web
    name: bici-reorder-point-dashboard-f
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      # Server-side only (NOT NEXT_PUBLIC): the internal backend base URL the proxy
      # forwards to, and the shared secret it injects. Set both in the dashboard.
      - key: BACKEND_INTERNAL_URL
        sync: false
      - key: BACKEND_SHARED_SECRET
        sync: false
